[pytest]
# Specify where to find tests
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Add Python path
pythonpath = .

# Basic options for normal testing
addopts = --no-header -v

# Test categorization markers
markers =
    unit: Unit tests that don't require external dependencies
    integration: Tests that check multiple components working together
    api: Tests that require the AssemblyAI API
    slow: Tests that take longer than 1 second to run

# Hide deprecation warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning 